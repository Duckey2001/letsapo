<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT & Cybersecurity Professional</title>
    <link rel="stylesheet" href="css.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-image: url('cyberteam.jpg');
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
            height: 100vh;
            font-family: Arial, sans-serif;
        }

        header {
            text-align: center;
            color: white;
            padding: 10px 0;
        }

        nav ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
            display: flex;
            justify-content: center;
            flex-wrap: wrap; /* Allow wrapping for smaller screens */
            gap: 15px;
        }

        nav ul li {
            display: inline;
        }

        nav ul li a {
            text-decoration: none;
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            transition: background 0.3s ease;
        }

        nav ul li a:hover {
            background: rgba(255, 255, 255, 0.2); /* Subtle hover effect */
        }

        footer {
            text-align: center;
            color: white;
            padding: 10px 0;
            position: absolute;
            bottom: 0;
            width: 100%;
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 1.5em;
                padding: 10px;
            }

            nav ul {
                flex-direction: column; /* Stack navigation links */
                gap: 10px;
            }
        }

        @media (max-width: 480px) {
            body {
                background-size: auto; /* Prevent cropping on very small screens */
            }

            header h1 {
                font-size: 1.2em;
            }
        }
    </style>
</head>

            </ul>
        </nav>

</body>
</html>
